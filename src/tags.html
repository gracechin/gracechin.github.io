---
layout: base.html
pagination:
  data: collections
  size: 1
  alias: tag
permalink: /tags/{{ tag }}/
---

<div class="container post-list">
  <h1>{{ tag }}</h1>
  <ul>
    {% for post in collections[tag] reversed %}
    <li>
      <h3>
        <a href="{{ post.url }}">{{ post.data.title }}</a>
      </h3>
      <span class="date">{{ post.data.date | formatDate }}</span>
      <p>{{ post.data.page.excerpt | md | stripPara }}</p>
    </li>
    {% endfor %}
  </ul>
</div>
